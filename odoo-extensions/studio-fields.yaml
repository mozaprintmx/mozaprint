# =============================================================================
# MODELOS NUEVOS
# =============================================================================

new_models:
  x_tecnica_personalizacion:
    display_name: 'Técnica de Personalización'
    description: 'Catálogo maestro de técnicas (lista plana, D7). CREADO y POBLADO en producción.'
    status: created
    # Verificado contra Odoo. Campos con prefijo x_ (no x_studio_, por ser modelo
    # custom propio). 20 técnicas cargadas (seed) vía scripts/seed_tecnicas.py;
    # fuente del seed en data/tecnicas_seed.csv.
    fields:
      - field_name: x_code
        field_type: char
        string: 'Código'
        status: created
        help: "Llave estable. Ej: 'serigrafia', 'dtf', 'laser'"

      - field_name: x_name
        field_type: char
        string: 'Name'
        status: created
        help: "Display. Ej: 'Serigrafía', 'Láser (Grabado Láser)'"

      - field_name: x_aliases
        field_type: text
        string: 'Aliases proveedor'
        status: created
        help: 'Variantes crudas del proveedor, separadas por " | ". El sync hace match contra ellas.'

      - field_name: x_orden
        field_type: integer
        string: 'Orden'
        status: created

      - field_name: x_activa
        field_type: boolean
        string: 'Activa'
        status: created

      - field_name: x_descripcion
        field_type: text
        string: 'Descripción'
        status: created
        help: 'Vacío al inicio; se llena después para el sitio.'

  x_approval_request:
    display_name: 'Solicitud de Aprobación'
    description: 'Solicitudes humanas para costos no parametrizados'
    status: staging
    # ⚠ Creado en STAGING 2026-08-08 (motor de cotización). Modelo manual → sus
    # campos LLEVAN prefijo x_ (Odoo exige x_ en campos manuales de modelos custom);
    # los nombres sin prefijo de la spec original NO son posibles. Nombres reales:
    fields:
      - field_name: x_name       # rec_name auto del modelo manual, usado como "Descripción"
        field_type: char
        required: true
        string: 'Descripción'
        status: staging

      - field_name: x_sale_order_id
        field_type: many2one
        relation: sale.order
        required: true
        on_delete: cascade
        string: 'Cotización'
        status: staging

      - field_name: x_channel_id
        field_type: many2one
        relation: discuss.channel
        string: 'Conversación WA'
        status: staging

      - field_name: x_reason
        field_type: text
        string: 'Razón'
        status: staging

      - field_name: x_context_json
        field_type: text
        string: 'Contexto (JSON)'
        status: staging

      - field_name: x_requested_at
        field_type: datetime
        string: 'Solicitado en'
        status: staging

      - field_name: x_responded_at
        field_type: datetime
        string: 'Respondido en'
        status: staging

      - field_name: x_responded_by_id
        field_type: many2one
        relation: res.users
        string: 'Respondido por'
        status: staging

      - field_name: x_status
        field_type: selection
        string: 'Estado'
        status: staging
        selection:
          - [pending, 'Pendiente']
          - [approved, 'Aprobada']
          - [rejected, 'Rechazada']

      - field_name: x_approved_cost_unit
        field_type: float
        string: 'Costo unitario aprobado'
        status: staging

      - field_name: x_approved_setup_cost
        field_type: float
        string: 'Costo de setup aprobado'
        status: staging

      - field_name: x_approved_servicio_id
        field_type: many2one
        relation: product.product
        string: 'Servicio aplicado'
        status: staging

      - field_name: x_notes
        field_type: text
