# Configuración Studio — Mozaprint
#
# Este archivo es la fuente de verdad versionable de los campos custom (x_) 
# y modelos custom creados vía Odoo Studio.
#
# Studio no exporta a YAML automáticamente. Este archivo se mantiene a mano 
# en paralelo a lo que está configurado en Odoo. Cada cambio en Studio 
# debe reflejarse aquí.
#
# Convenciones:
# - field_name: nombre técnico del campo (con prefijo x_)
# - field_type: char | text | integer | float | boolean | date | datetime | 
#              selection | many2one | many2many | one2many
# - string: etiqueta visible al usuario
# - help: texto de ayuda mostrado en el formulario
# - required: si es obligatorio (default false)
# - default: valor por defecto
# - relation: solo para many2one/many2many/one2many

version: '0.7.0'
last_updated: 2026-08-08

# =============================================================================
# NOTA IMPORTANTE — PREFIJO x_studio_ (depende de CÓMO se crea el campo)
# =============================================================================
#
# El prefijo "x_studio_" lo fuerza la UI de STUDIO, NO la instancia ni el modelo
# (corregido 2026-08-06, ver CLAUDE.md y specs/data-model.md):
# - Creado vía Studio UI      → Odoo fuerza "x_studio_<nombre>" (no editable).
# - Creado vía Ajustes → Técnico → Estructura de BD (ir.model / ir.model.fields):
#   conserva el nombre "x_<nombre>" que escribes, aun en modelos estándar
#   (ej. x_es_servicio_personalizacion en product.template; x_source_line_id
#   en sale.order.line; los campos de x_costo_personalizacion).
#
# Considerar esto al referenciar campos en vistas/Server Actions/n8n: NO asumir
# el prefijo — verificar el nombre real en Odoo (fields_get) antes de integrar.
#
# En este archivo:
#   status: created   → campo existe en PRODUCCIÓN (nombre técnico real)
#   status: staging   → creado en STAGING (ODOO_TEST_URL), pendiente de replicar a prod
#   status: planned   → planeado, aún no creado en ningún entorno
# =============================================================================

# =============================================================================
# EXTENSIONES A MODELOS EXISTENTES
# =============================================================================

extensions:
  product.template:
    # --- VÍNCULO CON PROVEEDOR ---
    # NO hay campo custom de proveedor. El vínculo producto↔proveedor usa el
    # estándar product.supplierinfo (partner_id, product_code=SKU, price=costo
    # base, min_qty). x_proveedor_id / x_proveedor_sku fueron DESCARTADOS (nunca
    # existieron en Odoo). Ver specs/data-model.md.

    # --- CREADOS (legacy, texto libre, verificados por audit 2026-06-11) ---
    # Existen en producción con prefijo x_ (no x_studio_). Fecha de creación
    # desconocida (anteceden a este registro). A deprecar tras migración a Fase 2.

    - field_name: x_tecnica_impresion
      field_type: char
      string: 'Tecnica de impresion'
      status: created
      help: 'Técnica(s) en texto libre, sin normalizar (5227 productos, 159 valores). FUENTE de migración a x_tecnica_default_id en Fase 2. NO borrar antes de validar.'

    - field_name: x_area_impresion
      field_type: char
      string: 'Area de impresion'
      status: created
      help: 'Área de impresión en texto libre (ej. "5x5 cm.").'

    - field_name: x_proveedor_carga
      field_type: char
      string: 'Proveedor Carga'
      status: created
      help: 'Etiqueta de texto libre del proveedor que cargó el producto. NO es el vínculo estructurado (ese es product.supplierinfo).'

    - field_name: x_material
      field_type: char
      string: 'Material'
      status: created

    - field_name: x_capacidad
      field_type: char
      string: 'Capacidad'
      status: created

    - field_name: x_medidas
      field_type: char
      string: 'Medidas'
      status: created

    - field_name: x_imagen_url_principal
      field_type: char
      string: 'URL imagen principal'
      status: created

    # --- CREADOS Y POBLADOS EN FASE 2 (técnica canónica) ---
    # Poblados por scripts/derive_tecnicas.py desde x_tecnica_impresion (~5,203 templates).

    - field_name: x_tecnica_default_id
      field_type: many2one
      relation: x_tecnica_personalizacion
      string: 'Técnica de personalización default'
      help: 'Técnica sugerida por defecto. Poblado por derive_tecnicas.py.'
      status: created

    - field_name: x_tecnicas_compatibles_ids
      field_type: many2many
      relation: x_tecnica_personalizacion
      string: 'Técnicas compatibles'
      help: 'Todas las técnicas posibles para este producto. Poblado por derive_tecnicas.py.'
      status: created

    # --- PLANIFICADOS (NO existen aún, se crean en Fase 2) ---

    - field_name: x_personalizacion_ninguna
      field_type: boolean
      string: 'No requiere personalización'
      default: false
      help: 'Producto que se vende sin personalizar (ej. stock para reventa directa)'
      status: planned

    - field_name: x_area_max_cm2
      field_type: float
      string: 'Área máxima de impresión (cm²)'
      status: planned

    - field_name: x_area_dimensiones
      field_type: char
      string: 'Dimensiones del área'
      help: "Texto descriptivo, ej. '10x10 cm'. Reconciliar con el legacy x_area_impresion"
      status: planned

    - field_name: x_tiempo_produccion_dias
      field_type: integer
      string: 'Tiempo de producción (días hábiles)'
      status: planned

    - field_name: x_requiere_cotizacion
      field_type: boolean
      string: 'Requiere cotización'
      default: true
      status: planned

    - field_name: x_es_servicio_personalizacion
      field_type: boolean
      string: 'Es servicio de personalización'
      default: false
      status: created
      created_date: 2026-08-06
      # Creado MANUALMENTE vía Ajustes → Técnico → Estructura de BD. Nombre técnico REAL sin
      # prefijo x_studio_ (verificado por fields_get): Técnico conserva el nombre x_ que se
      # escribe; SOLO Studio UI fuerza x_studio_ (igual que x_costo_personalizacion).

    - field_name: x_tecnica_servicio_id
      field_type: many2one
      relation: x_tecnica_personalizacion
      string: 'Técnica que representa este servicio'
      help: 'Solo para productos con x_es_servicio_personalizacion=True. Llave de idempotencia de seed_servicios_personalizacion.py.'
      status: created
      created_date: 2026-08-06
      # Creado manualmente vía Técnico. Nombre real sin x_studio_ (verificado por fields_get).

  crm.lead:
    # --- CREADOS EN PRODUCCIÓN (2026-06-02) ---

    - field_name: x_studio_collected_qty
      field_type: integer
      string: 'Cantidad solicitada'
      help: 'Cantidad de piezas que pide el cliente'
      status: created
